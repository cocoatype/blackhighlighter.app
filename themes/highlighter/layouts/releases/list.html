{{ define "main" }}
    <article class="post">
        <div class="post-header">
            <h1 class="post-title">{{ .Title }}</h1>
        </div>
        <div class="post-content">
            {{ range .Pages }}
            <section>
                <h2><a href="{{ .RelPermalink }}">{{ .Title }} &mdash; {{ dateFormat "January 2, 2006" .Date }}</a></h2>
                {{ .Content }}
            </section>
            {{ end }}
        </div>
    </article>
{{ end }}
