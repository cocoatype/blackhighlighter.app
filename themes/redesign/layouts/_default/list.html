{{ define "main" }}
    <article class="post">
        <div class="post-header">
            <h1 class="post-title">{{ .Title }}</h1>
        </div>
        <div class="post-content">
            {{ range .Pages }}
            <section>
                <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
                {{ if and (isset .Params "summary") (ne .Params.Summary "") }}
                    <p>{{ .Params.Summary | markdownify }}</p>
                {{ else }}
                    {{ .Summary }}
                {{ end }}
            </section>
            {{ end }}
        </div>
    </article>
{{ end }}
