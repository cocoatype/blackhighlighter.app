name: "Hugo Build"
description: "Builds the website with Hugo"
runs:
  using: "composite"

  steps:
    - name: "Download Hugo"
      shell: "bash"
      run: "wget https://github.com/gohugoio/hugo/releases/download/v0.161.1/hugo_0.161.1_linux-amd64.deb"

    - name: "Install Hugo"
      shell: "bash"
      run: "sudo apt install ./hugo_0.161.1_linux-amd64.deb"

    - name: "Build Site"
      shell: "bash"
      run: "hugo"
